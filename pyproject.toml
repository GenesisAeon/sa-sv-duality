[project]
name = "sa-sv-duality"
version = "1.0.0"
description = "S_A / S_V Entropy Duality - GenesisAeon Package 36 - Standalone Foundational Module"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Johann Roemer - MOR Research Collective" }]
requires-python = ">=3.11"
keywords = ["entropy", "duality", "UTAC", "CREP", "GenesisAeon", "mathematical-physics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
diamond = "diamond_setup.cli:app"
sav = "sa_sv_duality.cli:app"

[project.urls]
Homepage = "https://github.com/GenesisAeon/sa-sv-duality"
Repository = "https://github.com/GenesisAeon/sa-sv-duality"
Zenodo = "https://doi.org/10.5281/zenodo.17472834"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diamond_setup", "src/sa_sv_duality"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sa_sv_duality --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "numpy>=2.4.6",
    "pytest-cov>=7.0.0",
    "scipy>=1.17.1",
]

[[tool.mypy.overrides]]
module = ["sa_sv_duality.cli", "diamond_setup.cli"]
disallow_untyped_decorators = false
